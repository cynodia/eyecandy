<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Lissajous Flow · eyecandy</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body { background: #000; overflow: hidden; }
    canvas { display: block; }
    #back { position: fixed; top: 18px; left: 18px; color: rgba(255,255,255,.45);
      font: 13px/1 system-ui, sans-serif; text-decoration: none;
      border: 1px solid rgba(255,255,255,.2); padding: 6px 12px; border-radius: 20px;
      transition: color .2s, border-color .2s; }
    #back:hover { color: #fff; border-color: rgba(255,255,255,.6); }
    #label { position: fixed; bottom: 18px; left: 50%; transform: translateX(-50%);
      color: rgba(255,255,255,.3); font: 12px/1 system-ui, sans-serif; letter-spacing: .1em; }
  </style>
</head>
<body>
  <a href="index.html" id="back">← gallery</a>
  <canvas id="c"></canvas>
  <div id="label">LISSAJOUS FLOW</div>
  <script>
    const c = document.getElementById('c');
    const ctx = c.getContext('2d');
    let W, H;

    function resize() {
      W = c.width = window.innerWidth;
      H = c.height = window.innerHeight;
    }
    window.addEventListener('resize', resize);
    resize();

    // Parameters for multiple Lissajous curves
    const curves = Array.from({ length: 8 }, (_, i) => ({
      a: 1 + (i % 4) + 1,
      b: 1 + Math.floor(i / 2) + 1,
      delta: Math.random() * Math.PI * 2,
      speed: 0.0003 + Math.random() * 0.0002,
      hue: (i / 8) * 360,
      amplitude: 0.35 + Math.random() * 0.1,
    }));

    let t = 0;

    function draw() {
      ctx.fillStyle = 'rgba(0,0,0,0.04)';
      ctx.fillRect(0, 0, W, H);

      const cx = W / 2, cy = H / 2;
      const r = Math.min(W, H) * 0.42;

      curves.forEach((cv, idx) => {
        const pts = 600;
        ctx.beginPath();
        for (let i = 0; i <= pts; i++) {
          const angle = (i / pts) * Math.PI * 2;
          const x = cx + r * cv.amplitude * Math.sin(cv.a * angle + cv.delta + t * cv.speed * 500);
          const y = cy + r * cv.amplitude * Math.sin(cv.b * angle + t * cv.speed * 500 * 0.7);
          i === 0 ? ctx.moveTo(x, y) : ctx.lineTo(x, y);
        }
        const hue = (cv.hue + t * 0.02) % 360;
        ctx.strokeStyle = `hsla(${hue},80%,65%,0.55)`;
        ctx.lineWidth = 1.2;
        ctx.stroke();
      });

      t++;
      requestAnimationFrame(draw);
    }

    draw();
  </script>
</body>
</html>
